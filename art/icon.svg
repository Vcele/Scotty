<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A9E"/>
      <stop offset="1" stop-color="#140C3A"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9BE7FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFC6E8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC6E8"/>
      <stop offset="1" stop-color="#9BE7FF"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="108" height="108" fill="url(#bg)"/>
  <!-- foreground -->
  <g id="fg">
    <!-- beam -->
    <path d="M37,79 L42,53 H66 L71,79 Z" fill="url(#beam)"/>
    <!-- screen -->
    <rect x="30" y="27" width="48" height="30" rx="5" fill="#F3EEFF"/>
    <rect x="34" y="31" width="40" height="22" rx="2" fill="url(#glass)"/>
    <!-- pad -->
    <ellipse cx="54" cy="80" rx="19" ry="4.5" fill="#9BE7FF"/>
    <ellipse cx="54" cy="79" rx="12" ry="2.2" fill="#FFFFFF"/>
    <!-- sparkles -->
    <path d="M48,63 l1.4,3.6 3.6,1.4 -3.6,1.4 -1.4,3.6 -1.4,-3.6 -3.6,-1.4 3.6,-1.4 z" fill="#FFFFFF"/>
    <path d="M61,58.5 l1,2.5 2.5,1 -2.5,1 -1,2.5 -1,-2.5 -2.5,-1 2.5,-1 z" fill="#FFFFFF"/>
    <circle cx="59" cy="71" r="1.4" fill="#FFFFFF"/>
    <circle cx="53" cy="58" r="1" fill="#FFFFFF"/>
  </g>
</svg>
