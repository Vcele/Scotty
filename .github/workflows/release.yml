name: Build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Core tests
        working-directory: core
        run: cargo test

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SCOTTY_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SCOTTY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          SCOTTY_KEYSTORE_PASSWORD: ${{ secrets.SCOTTY_KEYSTORE_PASSWORD }}
          SCOTTY_KEY_ALIAS: ${{ secrets.SCOTTY_KEY_ALIAS }}
          SCOTTY_KEY_PASSWORD: ${{ secrets.SCOTTY_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9] ]] || VERSION="0.0.0-dev"
          export SCOTTY_VERSION="$VERSION"
          export SCOTTY_VERSION_CODE="${{ github.run_number }}"
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Scotty-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Scotty-apk
          path: Scotty-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Scotty-*.apk
          generate_release_notes: true
