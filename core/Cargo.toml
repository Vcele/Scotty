[package]
name = "scotty-core"
version = "0.1.0"
edition = "2021"
description = "Protocol core of Scotty: Miracast (Wi-Fi Display) source, AirPlay (RAOP + HLS video) sender"
license = "MIT"

[lib]
name = "scotty_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
log = "0.4"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
num-bigint = "0.4"
getrandom = "0.2"
plist = "1"
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[dev-dependencies]
env_logger = "0.11"
sha1 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
