[package]
name = "scotty-core"
version = "0.1.0"
edition = "2021"
description = "Protocol core of Scotty: Miracast (Wi-Fi Display) source, AirPlay (RAOP + HLS video) sender"
license = "MIT"

[lib]
name = "scotty_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[dev-dependencies]
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
